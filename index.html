    body { background: #0d1421; color: #d1d4dc; font-family: Arial; margin: 0; padding: 15px;}

    .calc button { background: #2962ff; color: #fff; padding: 12px 25px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
    .result { color: #00ff88; font-size: 20px; margin-top: 15px; font-weight: bold; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .chart { height: 350px; } }
  </style>
</head>
